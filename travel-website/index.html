<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--we will build the website here-->

    <header>
        <nav class="navbar">
        <div class="logo">Travel</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Destinations</a></li>
            <li><a href="#">Contact</a></li>
       

            <li class="dropdown">
                <a href="#">More</a>
                <ul class="dropdown-menu">
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Blog</a></li>
                </ul>
            </li>   
        </ul>
        <div class="hamburger">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </nav>
    </header>
    <section class="gallery-section">
        <h2>Gallery</h2>
        <div class="gallery">
            <img src="https://picsum.photos/300/200?random=1" alt="Gallery Image 1">
            <img src="https://picsum.photos/300/200?random=2" alt="Gallery Image 2">
            <img src="https://picsum.photos/300/200?random=3" alt="Gallery Image 3">
            <img src="https://picsum.photos/300/200?random=4" alt="Gallery Image 4">
            <img src="https://picsum.photos/300/200?random=5" alt="Gallery Image 5">
            <img src="https://picsum.photos/300/200?random=6" alt="Gallery Image 6">
        </div>
    </section>

    <section class="contact-section">
        <h2>Contact Us</h2>
        <form class="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Mesaage" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <section class="card-section">
        <h2>Top Destinations</h2>
        <div class="card-container">
            <div class="card">
                <img src="https://picsum.photos/300/200?random=11" alt="Card 1">
                <h3>Paris</h3>
                <p>The city of lights and love. </p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?random=12" alt="Card 2">
                <h3>Tokyo</h3>
                <p>Experience futuristic vibes and rich culture </p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?random=13" alt="Card 3">
                <h3>New York</h3>
                <p>The city that never sleep</p>
            </div>
        </div>
    </section>
    

    <button id="openModalBtn" class="open-modal-btn">Login</button>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Login</h2>
            <form class="modal-form">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <footer style="background: #008cba; color:white;text-align: center;padding:20px">
        <p>&copy;2025 Travel.All Rights Reserved</p>
    </footer>
    <script src="script.js"></script>
    
</body>
</html>
